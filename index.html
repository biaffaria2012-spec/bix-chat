<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BIX</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: white;
      font-family: "Comfortaa", sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font-family: inherit;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* TOPO */

    header {
      height: 70px;
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      background: #111111;
      border-bottom: 1px solid #292929;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 4px;
      color: white;
    }

    .profile-button {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid #444;
      background: #202020;
      color: white;
      cursor: pointer;
      overflow: hidden;
      padding: 0;
    }

    .profile-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .default-avatar {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* CHAT */

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      scroll-behavior: smooth;
    }

    .status {
      text-align: center;
      color: #888;
      font-size: 13px;
      margin: 10px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 850px;
      width: fit-content;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      overflow: hidden;
      background: #252525;
      border: 1px solid #3a3a3a;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .avatar-letter {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #ddd;
      font-size: 15px;
      font-weight: 700;
    }

    .message-content {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 10px 13px;
      min-width: 100px;
    }

    .nickname {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 5px;
    }

    .text {
      font-family: Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      color: #e9e9e9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .time {
      font-family: Arial, sans-serif;
      font-size: 10px;
      color: #777;
      margin-top: 6px;
    }

    .reply-preview {
      border-left: 3px solid #777;
      background: #222;
      padding: 7px 9px;
      margin-bottom: 8px;
      border-radius: 5px;
      cursor: pointer;
    }

    .reply-name {
      font-size: 11px;
      font-weight: bold;
      color: #ccc;
      margin-bottom: 2px;
    }

    .reply-text {
      font-family: Arial, sans-serif;
      font-size: 11px;
      color: #999;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      max-width: 350px;
    }

    .message-actions {
      display: flex;
      gap: 7px;
      margin-top: 6px;
    }

    .reply-button {
      background: transparent;
      border: none;
      color: #777;
      font-size: 11px;
      cursor: pointer;
      padding: 2px 0;
    }

    .reply-button:hover {
      color: white;
    }

    /* COMPOSITOR */

    .composer-area {
      padding: 12px 18px 18px;
      background: #111;
      border-top: 1px solid #292929;
    }

    .replying {
      display: none;
      max-width: 900px;
      margin: 0 auto 8px;
      background: #1b1b1b;
      border-left: 3px solid #888;
      border-radius: 7px;
      padding: 8px 10px;
      position: relative;
    }

    .replying.show {
      display: block;
    }

    .replying-title {
      font-size: 11px;
      color: #aaa;
    }

    .replying-text {
      font-family: Arial, sans-serif;
      font-size: 12px;
      color: #ddd;
      margin-top: 3px;
      max-width: calc(100% - 30px);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .cancel-reply {
      position: absolute;
      right: 8px;
      top: 7px;
      border: none;
      background: transparent;
      color: #888;
      cursor: pointer;
      font-size: 18px;
    }

    .composer {
      max-width: 900px;
      margin: auto;
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      min-height: 45px;
      max-height: 130px;
      resize: none;
      background: #1a1a1a;
      color: white;
      border: 1px solid #333;
      border-radius: 13px;
      padding: 13px;
      outline: none;
      font-size: 14px;
    }

    textarea:focus {
      border-color: #666;
    }

    .send-button {
      height: 45px;
      padding: 0 18px;
      border: none;
      border-radius: 12px;
      background: white;
      color: black;
      font-weight: 700;
      cursor: pointer;
    }

    .send-button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* PERFIL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .profile-box {
      width: 100%;
      max-width: 390px;
      background: #161616;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .profile-box h2 {
      margin: 0 0 20px;
      font-size: 20px;
    }

    .profile-preview {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .big-avatar {
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #252525;
      border: 1px solid #444;
      overflow: hidden;
    }

    .big-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 44px;
      background: #202020;
      color: white;
      border: 1px solid #363636;
      border-radius: 9px;
      padding: 0 12px;
      outline: none;
    }

    .field input:focus {
      border-color: #666;
    }

    .profile-buttons {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .profile-buttons button {
      flex: 1;
      height: 43px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 700;
    }

    .save-profile {
      border: none;
      background: white;
      color: black;
    }

    .close-profile {
      border: 1px solid #444;
      background: #222;
      color: white;
    }

    @media (max-width: 600px) {
      header {
        height: 62px;
        min-height: 62px;
        padding: 0 15px;
      }

      .logo {
        font-size: 21px;
      }

      #messages {
        padding: 15px 10px;
      }

      .message {
        max-width: 92%;
      }

      .composer-area {
        padding: 9px 9px 12px;
      }

      .send-button {
        padding: 0 13px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">BIX</div>

    <button class="profile-button" id="profileButton" title="Meu perfil">
      <div class="default-avatar">👤</div>
    </button>
  </header>

  <main id="messages">
    <div class="status" id="status">
      Conectando ao chat...
    </div>
  </main>

  <div class="composer-area">

    <div class="replying" id="replying">
      <button class="cancel-reply" id="cancelReply">×</button>
      <div class="replying-title">
        Respondendo a <strong id="replyingName"></strong>
      </div>
      <div class="replying-text" id="replyingText"></div>
    </div>

    <div class="composer">
      <textarea
        id="messageInput"
        placeholder="Digite uma mensagem..."
        maxlength="500"
        rows="1"
      ></textarea>

      <button class="send-button" id="sendButton">
        Enviar
      </button>
    </div>

  </div>
</div>


<!-- MODAL DE PERFIL -->

<div class="modal" id="profileModal">

  <div class="profile-box">

    <h2>Meu perfil</h2>

    <div class="profile-preview">
      <div class="big-avatar" id="bigAvatar">
        <div class="default-avatar">👤</div>
      </div>
    </div>

    <div class="field">
      <label>Apelido</label>
      <input
        id="nicknameInput"
        type="text"
        maxlength="30"
        placeholder="Seu apelido"
      >
    </div>

    <div class="field">
      <label>URL da foto de perfil</label>
      <input
        id="avatarInput"
        type="url"
        placeholder="https://..."
      >
    </div>

    <div class="profile-buttons">
      <button class="close-profile" id="closeProfile">
        Cancelar
      </button>

      <button class="save-profile" id="saveProfile">
        Salvar
      </button>
    </div>

  </div>

</div>


<script>

  /* ==========================================
     CONFIGURAÇÃO DO SUPABASE
     ========================================== */

  const SUPABASE_URL =
    "https://pwjghlprzukfrizjhela.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_hTR5zTIJnny-8ZD_ckYIgA_BUD4Ykuo";


  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ==========================================
     ELEMENTOS
     ========================================== */

  const messagesElement =
    document.getElementById("messages");

  const statusElement =
    document.getElementById("status");

  const messageInput =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const profileButton =
    document.getElementById("profileButton");

  const profileModal =
    document.getElementById("profileModal");

  const nicknameInput =
    document.getElementById("nicknameInput");

  const avatarInput =
    document.getElementById("avatarInput");

  const bigAvatar =
    document.getElementById("bigAvatar");

  const saveProfile =
    document.getElementById("saveProfile");

  const closeProfile =
    document.getElementById("closeProfile");

  const replying =
    document.getElementById("replying");

  const replyingName =
    document.getElementById("replyingName");

  const replyingText =
    document.getElementById("replyingText");

  const cancelReply =
    document.getElementById("cancelReply");


  /* ==========================================
     PERFIL LOCAL
     ========================================== */

  let nickname =
    localStorage.getItem("bix_nickname") || "Visitante";

  let avatar =
    localStorage.getItem("bix_avatar") || "";

  let userId =
    localStorage.getItem("bix_user_id");


  if (!userId) {

    if (window.crypto && crypto.randomUUID) {
      userId = crypto.randomUUID();
    } else {
      userId =
        "user-" +
        Date.now() +
        "-" +
        Math.random().toString(36).substring(2);
    }

    localStorage.setItem("bix_user_id", userId);
  }


  let replyTo = null;


  /* ==========================================
     PERFIL
     ========================================== */

  function updateProfileButton() {

    if (avatar) {

      profileButton.innerHTML =
        `<img src="${escapeAttribute(avatar)}"
        onerror="this.parentElement.innerHTML='<div class=\\'default-avatar\\'>👤</div>'">`;

    } else {

      profileButton.innerHTML =
        `<div class="default-avatar">👤</div>`;
    }
  }


  function updateBigAvatar() {

    if (avatar) {

      bigAvatar.innerHTML =
        `<img src="${escapeAttribute(avatar)}"
        onerror="this.parentElement.innerHTML='<div class=\\'default-avatar\\'>👤</div>'">`;

    } else {

      bigAvatar.innerHTML =
        `<div class="default-avatar">👤</div>`;
    }
  }


  function escapeAttribute(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  function openProfile() {

    nicknameInput.value = nickname;
    avatarInput.value = avatar;

    updateBigAvatar();

    profileModal.classList.add("show");
  }


  function closeProfileModal() {

    profileModal.classList.remove("show");
  }


  profileButton.addEventListener(
    "click",
    openProfile
  );


  closeProfile.addEventListener(
    "click",
    closeProfileModal
  );


  saveProfile.addEventListener(
    "click",
    () => {

      const newNickname =
        nicknameInput.value.trim();

      const newAvatar =
        avatarInput.value.trim();


      nickname =
        newNickname || "Visitante";

      avatar =
        newAvatar;


      localStorage.setItem(
        "bix_nickname",
        nickname
      );

      localStorage.setItem(
        "bix_avatar",
        avatar
      );


      updateProfileButton();

      closeProfileModal();
    }
  );


  profileModal.addEventListener(
    "click",
    (event) => {

      if (event.target === profileModal) {
        closeProfileModal();
      }

    }
  );


  updateProfileButton();


  /* ==========================================
     RESPOSTA
     ========================================== */

  function startReply(message) {

    replyTo = message;

    replyingName.textContent =
      message.nickname;

    replyingText.textContent =
      message.content;

    replying.classList.add("show");

    messageInput.focus();
  }


  function cancelReplyFunction() {

    replyTo = null;

    replying.classList.remove("show");
  }


  cancelReply.addEventListener(
    "click",
    cancelReplyFunction
  );


  /* ==========================================
     FORMATAÇÃO DE DATA
     ========================================== */

  function formatTime(date) {

    return new Date(date).toLocaleTimeString(
      "pt-BR",
      {
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /* ==========================================
     MOSTRAR MENSAGEM
     ========================================== */

  function renderMessage(message) {

    const wrapper =
      document.createElement("div");

    wrapper.className = "message";

    const avatarHTML =
      message.avatar
        ? `<img src="${escapeAttribute(message.avatar)}"
             onerror="this.parentElement.innerHTML='<div class=\\'avatar-letter\\'>${getInitial(message.nickname)}</div>'">`
        : `<div class="avatar-letter">
             ${escapeHTML(getInitial(message.nickname))}
           </div>`;


    let replyHTML = "";

    if (message.reply_content) {

      replyHTML = `
        <div class="reply-preview">
          <div class="reply-name">
            ${escapeHTML(message.reply_name || "Visitante")}
          </div>

          <div class="reply-text">
            ${escapeHTML(message.reply_content)}
          </div>
        </div>
      `;
    }


    wrapper.innerHTML = `

      <div class="avatar">
        ${avatarHTML}
      </div>

      <div>

        <div class="message-content">

          ${replyHTML}

          <div class="nickname">
            ${escapeHTML(message.nickname)}
          </div>

          <div class="text">
            ${escapeHTML(message.content)}
          </div>

          <div class="time">
            ${formatTime(message.created_at)}
          </div>

        </div>

        <div class="message-actions">

          <button class="reply-button">
            ↩ Responder
          </button>

        </div>

      </div>
    `;


    const replyButton =
      wrapper.querySelector(".reply-button");


    replyButton.addEventListener(
      "click",
      () => startReply(message)
    );


    messagesElement.appendChild(wrapper);
  }


  function getInitial(name) {

    if (!name) return "?";

    return name
      .trim()
      .charAt(0)
      .toUpperCase();
  }


  function escapeHTML(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  /* ==========================================
     CARREGAR MENSAGENS
     ========================================== */

  async function loadMessages() {

    statusElement.textContent =
      "Carregando mensagens...";


    const { data, error } =
      await supabaseClient
        .from("messages")
        .select("*")
        .order("created_at", {
          ascending: true
        });


    if (error) {

      console.error(error);

      statusElement.textContent =
        "Não foi possível carregar as mensagens.";

      return;
    }


    statusElement.remove();


    data.forEach(
      renderMessage
    );


    scrollToBottom();
  }


  /* ==========================================
     ENVIAR
     ========================================== */

  async function sendMessage() {

    const content =
      messageInput.value.trim();


    if (!content) return;


    if (content.length > 500) {

      alert(
        "A mensagem pode ter no máximo 500 caracteres."
      );

      return;
    }


    sendButton.disabled = true;

    sendButton.textContent =
      "Enviando...";


    const messageData = {

      user_id: userId,

      nickname:
        nickname || "Visitante",

      avatar:
        avatar || null,

      content:
        content

    };


    if (replyTo) {

      messageData.reply_to =
        replyTo.id;

      messageData.reply_name =
        replyTo.nickname;

      messageData.reply_content =
        replyTo.content;
    }


    const { error } =
      await supabaseClient
        .from("messages")
        .insert(messageData);


    if (error) {

      console.error(error);

      alert(
        "Não foi possível enviar a mensagem.\n\n" +
        error.message
      );

    } else {

      messageInput.value = "";

      cancelReplyFunction();
    }


    sendButton.disabled = false;

    sendButton.textContent =
      "Enviar";
  }


  sendButton.addEventListener(
    "click",
    sendMessage
  );


  messageInput.addEventListener(
    "keydown",
    (event) => {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();
      }

    }
  );


  /* ==========================================
     ENTER AUTOMÁTICO DO TEXTAREA
     ========================================== */

  messageInput.addEventListener(
    "input",
    () => {

      messageInput.style.height =
        "auto";

      messageInput.style.height =
        Math.min(
          messageInput.scrollHeight,
          130
        ) + "px";
    }
  );


  /* ==========================================
     REALTIME
     ========================================== */

  function connectRealtime() {

    const channel =
      supabaseClient
        .channel("bix-chat");

    channel
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "messages"
        },
        (payload) => {

          renderMessage(
            payload.new
          );

          scrollToBottom();
        }
      )
      .subscribe(
        (status) => {

          console.log(
            "Status do chat:",
            status
          );

          if (
            status === "SUBSCRIBED"
          ) {

            console.log(
              "Chat conectado!"
            );
          }

          if (
            status === "CHANNEL_ERROR"
          ) {

            console.error(
              "Erro no Realtime."
            );
          }
        }
      );
  }


  /* ==========================================
     ROLAR PARA BAIXO
     ========================================== */

  function scrollToBottom() {

    setTimeout(
      () => {

        messagesElement.scrollTop =
          messagesElement.scrollHeight;

      },
      50
    );
  }


  /* ==========================================
     INICIAR
     ========================================== */

  async function startChat() {

    try {

      await loadMessages();

      connectRealtime();

    } catch (error) {

      console.error(error);

      statusElement.textContent =
        "Erro ao conectar ao chat.";

    }

  }


  startChat();

</script>

</body>
</html>
